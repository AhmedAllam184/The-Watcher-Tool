name: Deploy image

on:
  push:
    branches: [claude/upbeat-volta-volh6b]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        shell: bash
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/render/Dockerfile
          push: true
          tags: |
            ghcr.io/ahmedallam184/the-watcher:latest
            ghcr.io/ahmedallam184/the-watcher:sha-${{ steps.tags.outputs.short }}
      - name: Redeploy Render when configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          fi
